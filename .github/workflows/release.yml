name: Release binaries

# Runs whenever a tag matching v*.*.* is pushed (e.g. v0.1.0), builds
# tuneup for the common Linux/macOS architectures, and attaches the
# binaries to the corresponding GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          out="dist/tuneup-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$out" ./cmd/tuneup
          tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
          rm "$out"

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuneup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
