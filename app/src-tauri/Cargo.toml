[package]
name = "tuneup-app"
version = "1.0.0"
description = "Desktop app for the tuneup Linux hardware diagnostics tool"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync"] }

[[bin]]
name = "tuneup-app"
path = "src/main.rs"
